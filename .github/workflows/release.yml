name: Release

# The release is the tag vX.Y.Z itself (go get github.com/zequent/zqnt-sdk-go/v3@vX.Y.Z), cut by
# the maintainer; this workflow tests it and creates the GitHub Release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Test & publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Build, vet, test
        run: go build ./... && go vet ./... && go test ./... -timeout 5m

      - name: GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
