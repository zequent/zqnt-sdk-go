name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      # No submodules in this repo anymore (removed in the Sept 2 migration) and self-checkout
      # doesn't need GH_PAT -- the default GITHUB_TOKEN handles that. GH_PAT is only genuinely
      # needed below, to fetch the private zqnt-utils-golang module during go build.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      # The private modules are downloaded here, with the token only in this step's environment;
      # lint, build and test then run from the module cache without it.
      - name: Download modules (private ones with GH_PAT)
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.GH_PAT }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: |
          go env -w GOPRIVATE="github.com/Zequent/*,github.com/zequent/*"
          go mod download

      - name: golangci-lint
        # golangci-lint v1 ("latest" under action v6) is built with Go 1.24 and refuses a module that
        # targets Go 1.25 ("the Go language version used to build golangci-lint is lower than the
        # targeted Go version"); v2 is built with a current Go. Pinned so a new release cannot turn
        # the build red overnight.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --timeout=5m

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # The private modules are downloaded here, with the token only in this step's environment;
      # lint, build and test then run from the module cache without it.
      - name: Download modules (private ones with GH_PAT)
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.GH_PAT }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: |
          go env -w GOPRIVATE="github.com/Zequent/*,github.com/zequent/*"
          go mod download

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

  # Tags and pre-releases every PR build so it's individually go get-able for review/testing --
  # deliberately NOT a "v*"-shaped tag: the release workflow triggers on tags: ["v*"], and this
  # must never accidentally fire that (a real production release is only ever an intentional
  # `git tag vX.Y.Z && git push` by a maintainer). `go get .../zqnt-edge-sdk-go@pr-<n>-<sha>` still
  # resolves fine -- Go accepts any git ref as a version query, converting non-semver tags to a
  # pseudo-version automatically. Uses the built-in GITHUB_TOKEN, not GH_PAT: pushing a tag/
  # creating a release needs repo write access, not private-module read access.
  pr-preview:
    name: Tag PR preview build
    needs: [lint, build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Compute preview tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "tag=pr-${{ github.event.pull_request.number }}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      # The checkout keeps no credentials; the push authenticates in this step only.
      - name: Create and push preview tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "${{ steps.tag.outputs.tag }}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${{ steps.tag.outputs.tag }}"

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "PR #${{ github.event.pull_request.number }} preview (${{ steps.tag.outputs.tag }})"
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
