name: Main

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      # No submodules in this repo anymore (removed in the Sept 2 migration) and self-checkout
      # doesn't need GH_PAT -- the default GITHUB_TOKEN handles that. GH_PAT is only genuinely
      # needed below, to fetch the private zqnt-utils-golang module during go build.
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Configure private module access
        run: |
          go env -w GOPRIVATE="github.com/Zequent/*,github.com/zequent/*"
          git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
