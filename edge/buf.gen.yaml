version: v2

# Source of truth: utils/zqnt-utils/src/main/proto in the zqnt-platform monorepo -- the same
# canonical .proto files every other language SDK/adapter in the platform generates from. This
# used to point at a `proto/` git submodule (a separate, independently-versioned zqnt-protos repo)
# that had drifted badly out of date -- missing the entire Skill/Application/capability-execution
# model, still on the pre-migration Mission/Task API surface. Removed 2026-09-02; see git history
# and this repo's README for the full migration writeup.
inputs:
  - directory: ../../../utils/zqnt-utils/src/main/proto

plugins:
  # Generates message structs and enums (*.pb.go). Each proto file's own `go_package` option
  # already names its real output path (e.g. "gen/common/asset/proto") -- the M<file>=<module>/
  # <go_package> mappings below just supply the full module prefix protoc-gen-go needs for
  # cross-file imports to resolve correctly; `out: .` (this repo's root) is where each go_package
  # path is then rooted.
  - local: protoc-gen-go
    out: .
    opt:
      - paths=import
      - module=github.com/Zequent/zqnt-edge-sdk-go
      - Masset.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/common/asset/proto
      - Mbase.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/common/base/proto
      - Mcapability-execution-contracts.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/execution/contracts/proto
      - Mcapability-execution-dto.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/execution/dto/proto
      - Mcapability-execution-types.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/execution/domain/types/proto
      - Mcommon.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/common/proto
      - Mconnector.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/connector/proto
      - Mdetection.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/common/detection/proto
      - Mdevice-control-contracts.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/devicecontrol/contracts/proto
      - Medge.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/edge/sdk/proto
      - Mevents.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/events/proto
      - Mlive-data-types.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/livedata/proto
      - Mlive-data.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/livedata/proto
      - Mmission-autonomy-contracts.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/missionautonomy/contracts/proto
      - Mmission-autonomy-dto.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/missionautonomy/dto/proto
      - Mmission-autonomy-types.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/missionautonomy/domain/types/proto
      - Mmission-autonomy.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/missionautonomy/proto
      - Mremote-control.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/remotecontrol/proto

  # Generates gRPC client stubs and server interfaces (*_grpc.pb.go) -- same mappings as above.
  - local: protoc-gen-go-grpc
    out: .
    opt:
      - paths=import
      - module=github.com/Zequent/zqnt-edge-sdk-go
      - require_unimplemented_servers=true
      - Masset.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/common/asset/proto
      - Mbase.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/common/base/proto
      - Mcapability-execution-contracts.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/execution/contracts/proto
      - Mcapability-execution-dto.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/execution/dto/proto
      - Mcapability-execution-types.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/execution/domain/types/proto
      - Mcommon.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/common/proto
      - Mconnector.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/connector/proto
      - Mdetection.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/common/detection/proto
      - Mdevice-control-contracts.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/devicecontrol/contracts/proto
      - Medge.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/edge/sdk/proto
      - Mevents.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/events/proto
      - Mlive-data-types.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/livedata/proto
      - Mlive-data.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/livedata/proto
      - Mmission-autonomy-contracts.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/missionautonomy/contracts/proto
      - Mmission-autonomy-dto.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/missionautonomy/dto/proto
      - Mmission-autonomy-types.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/missionautonomy/domain/types/proto
      - Mmission-autonomy.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/missionautonomy/proto
      - Mremote-control.proto=github.com/Zequent/zqnt-edge-sdk-go/gen/remotecontrol/proto
