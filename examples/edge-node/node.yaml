# zqnt-edge-node configuration. Check it with: zqnt-edge-node --config node.yaml --check-config

# The node's id, as registered on the platform.
node_id: pi-north-gate

# Assets announced in every Hello. Assets that adapters register on the local socket are added
# while the node runs and announced from the next session on.
assets:
  - DOCK-1

# The durable outbox: everything for the platform waits here while the link is down.
store:
  path: /var/lib/zqnt-edge-node/node.db
  # flush_interval: 200ms

# Lane quotas; a lane left out keeps its default (alarm 2000 items, command_reply 2000 items,
# status 500 items, telemetry 50MiB, bulk 100MiB).
quotas:
  telemetry:
    max_bytes: 20MiB

# The socket Device Adapters attach to. Only owner and group may have access.
local:
  socket: /run/zqnt-edge-node/node.sock
  mode: "0660"
  # group: zqnt
  # Commands for assets whose adapter did not name its own socket go here.
  default_adapter_endpoint: unix:///run/zqnt-edge-node/adapter.sock

# LinkReport to the platform and the "node stats" log line.
report_interval: 1m
# How long a stopping node waits for running commands.
shutdown_timeout: 10s

log:
  level: info
  format: text

# One link for now; switching between several links comes with the link manager.
links:
  - id: lte
    driver: ip-session
    endpoint: edge-link.example.com:443
    # token_file: /etc/zqnt-edge-node/token
    # ca_file: /etc/zqnt-edge-node/ca.pem
    # insecure: false
